<html>
<head>
    <script type="text/javascript" src="js/@microsoft/signalr/dist/browser/signalr.js"></script>
    <script type="text/javascript" src="js/constants.js"></script>
    <script type="text/javascript" src="js/utils.js"></script>
    <script type="text/javascript" src="js/map.js"></script>
    <script type="text/javascript" src="js/bomber.js"></script>
    <script type="text/javascript" src="js/game.js"></script>
    <script type="text/javascript" src="js/assman.js"></script>
    <script type="text/javascript" src="js/renderer.js"></script>
    <script type="text/javascript" src="js/main.js"></script>
    <style type="text/css">
        html, body {
            background: #212121;
            color: #fff;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        #canvas {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            margin: auto;
        }

        #controls {
            padding: 20px;
        }

        #controls label {
            display: inline-block;
            min-width: 90px;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="480" height="415">
    </canvas>

    <div id="controls">
        <label for="fps-slider">FPS: <span id="fps-value"></span></label>
        <input type="range" id="fps-slider" min="0" max="60" />
    </div>

    <div>
        <h3>Press 'd' to toggle debug mode.</h3>
        <div id="debug"></div>
    </div>
</body>
</html>
